<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Comercial</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Font Awesome (ícones) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ========================
       RESET / BASE
    ======================== */
    :root {
      color-scheme: light;
      --color-primary: #0066cc;
      --color-primary-focus: #0071e3;
      --color-ink: #1d1d1f;
      --color-ink-muted: #333333;
      --color-ink-subtle: #7a7a7a;
      --color-canvas: #ffffff;
      --color-parchment: #f5f5f7;
      --color-hairline: #e0e0e0;
      --color-raised: #ffffff;
      --color-control-hover: #fafafc;
      --color-border-hover: #c7c7cc;
      --shadow-kpi-hover: 0 8px 20px rgba(0, 0, 0, 0.08);
      --shadow-control-hover: 0 2px 8px rgba(0, 0, 0, 0.08);
      --chart-text: #333333;
      --chart-grid: #e0e0e0;
      --chart-border: #e0e0e0;
      --chart-bar: #0066cc;
      --chart-selected: #0066cc;
      --chart-line: #0066cc;
      --chart-hover: #0066cc;
      --chart-fill: rgba(0, 102, 204, 0.16);
      --chart-point-border: #ffffff;
      --chart-tooltip: #ffffff;
      --chart-tooltip-text: #1d1d1f;
      --chart-tooltip-border: #e0e0e0;
      --chart-tooltip-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      --chart-tooltip-font: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-primary: #5e6ad2;
      --color-primary-focus: #5e69d1;
      --color-ink: #f7f8f8;
      --color-ink-muted: #d0d6e0;
      --color-ink-subtle: #8a8f98;
      --color-canvas: #0f1011;
      --color-parchment: #010102;
      --color-hairline: #23252a;
      --color-raised: #141516;
      --color-control-hover: #18191a;
      --color-border-hover: #3e3e44;
      --shadow-kpi-hover: 0 8px 20px rgba(0, 0, 0, 0.24);
      --shadow-control-hover: 0 2px 8px rgba(0, 0, 0, 0.2);
      --chart-text: #d0d6e0;
      --chart-grid: #23252a;
      --chart-border: #34343a;
      --chart-bar: #5e6ad2;
      --chart-bar-secondary: #7a7fad;
      --chart-bar-light: #aeb8d4;
      --chart-bar-deep: #3e4a78;
      --chart-selected: #828fff;
      --chart-line: #5e6ad2;
      --chart-fill: rgba(94, 106, 210, 0.16);
      --chart-point-border: #141516;
      --chart-hover: #828fff;
      --chart-tooltip: #0f1011;
      --chart-tooltip-text: #f7f8f8;
      --chart-tooltip-border: #34343a;
      --chart-tooltip-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    html, body {
      margin: 0;
      font-family: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif;
      background: var(--color-parchment);
      color: var(--color-ink);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Por padrão deixamos permitir rolagem — será bloqueada apenas em telas grandes */
    body { overflow: auto; }

    /* container geral — largura responsiva e espaçamento lateral */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 24px;   /* recuo entre bordas da tela e conteúdo */
      box-sizing: border-box;
    }

    /* ========================
       HEADER
    ======================== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header h2 {
      margin: 0;
      color: var(--color-ink);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.14;
      letter-spacing: -0.28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h2 i { color: var(--color-primary); }

    .header-content { min-width: 0; }

    .header p {
      margin: 6px 0 0 0;
      font-size: 14px;
      line-height: 1.43;
      color: var(--color-ink-subtle);
    }

    .theme-toggle {
      position: relative;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--color-hairline);
      border-radius: 50%;
      background: var(--color-canvas);
      color: var(--color-ink);
      font: inherit;
      cursor: pointer;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .theme-toggle::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 10;
      padding: 6px 9px;
      border: 1px solid var(--color-hairline);
      border-radius: 6px;
      background: var(--color-canvas);
      color: var(--color-ink);
      box-shadow: var(--chart-tooltip-shadow);
      font: 400 12px/1.4 "SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 120ms ease, visibility 120ms ease;
    }

    .theme-toggle:hover::after,
    .theme-toggle:focus-visible::after {
      opacity: 1;
      visibility: visible;
    }

    .theme-toggle:disabled {
      color: var(--color-ink-subtle);
      background: var(--color-parchment);
      border-color: var(--color-hairline);
      cursor: not-allowed;
      opacity: 0.7;
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--color-primary-focus);
      outline-offset: 2px;
    }

    .theme-toggle:active { transform: scale(0.99); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ========================
       FILTROS
    ======================== */
    .filtros {
      display: flex;
      gap: 20px;
      margin: 18px 0;
      color: var(--color-ink);
      align-items: flex-end;
      flex-wrap: nowrap; /* mudará em mobile */
    }

    .filtro {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 180px;
    }

    .filtro label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink-muted);
    }

    select {
      width: 180px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid var(--color-hairline);
      box-sizing: border-box;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-ink);
      background: var(--color-canvas);
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    select:focus-visible {
      outline: 2px solid var(--color-primary-focus);
      outline-offset: 2px;
    }

    select:disabled {
      color: var(--color-ink-subtle);
      background: var(--color-parchment);
      border-color: var(--color-hairline);
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* ========================
       GRID PRINCIPAL (DESKTOP)
       - Em telas grandes ocupamos a altura da viewport (100vh)
       - Em telas pequenas (mobile/tablet) quebramos para 1 coluna
    ======================== */

    /* Grid default (desktop) - altura controlada pela media query abaixo */
    .parent {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 96px 1fr 1fr;
      gap: 15px;
    }

    /* ========================
       CARDS
    ======================== */
    .card {
      background: var(--color-canvas);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background-color 180ms ease;
    }

    :root[data-theme="dark"] .card { border-radius: 12px; }

    :root[data-theme="dark"] .div5,
    :root[data-theme="dark"] .div6 {
      background: var(--color-raised);
    }

    @media (hover: hover) and (pointer: fine) {
      .kpi:hover {
        position: relative;
        z-index: 1;
        transform: translateY(-2px);
        box-shadow: var(--shadow-kpi-hover);
      }

      .div5:hover,
      .div6:hover {
        border-color: var(--color-border-hover);
        background: var(--color-control-hover);
      }

      select:not(:disabled):hover,
      .theme-toggle:not(:disabled):hover {
        transform: scale(1.01);
        border-color: var(--color-border-hover);
        background: var(--color-control-hover);
        box-shadow: var(--shadow-control-hover);
      }
    }

    select:not(:disabled):active,
    .theme-toggle:not(:disabled):active {
      transform: scale(0.99);
      border-color: var(--color-primary-focus);
      background: var(--color-raised);
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      select,
      .theme-toggle {
        transition: none;
      }

      .kpi:hover,
      select:not(:disabled):hover,
      .theme-toggle:hover,
      .theme-toggle:active {
        transform: none;
      }
    }

    /* first row (KPIs) look */
    .kpi {
      justify-content: center;
      gap: 7px;
      padding: 10px 12px;
      align-items: center;
      text-align: center;
    }

    .kpi span {
      font-size: 11px;
      opacity: 1;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--color-ink-muted);
    }

    .kpi h2 {
      margin: 6px 0 0 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--color-ink);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .kpi i { color: var(--color-ink-subtle); }

    /* gráficos */
    .card h4 {
      margin: 0 0 10px 0;
      text-transform: uppercase;
      color: var(--color-ink);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .chart-container {
      position: relative;
      flex: 1;
      min-height: 220px; /* garante espaço base */
    }

    .chartjs-tooltip {
      position: absolute;
      z-index: 5;
      max-width: calc(100% - 16px);
      padding: 9px 11px;
      border: 1px solid var(--chart-tooltip-border);
      border-radius: 8px;
      background: var(--chart-tooltip);
      color: var(--chart-tooltip-text);
      box-shadow: var(--chart-tooltip-shadow);
      font: 400 12px/1.4 var(--chart-tooltip-font);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 8px));
      transition: opacity 80ms ease;
    }

    .chartjs-tooltip.is-below {
      transform: translate(-50%, 8px);
    }

    .chartjs-tooltip-title {
      margin: 0 0 3px;
      font-weight: 600;
    }

    .chartjs-tooltip-value { margin: 0; }

    /* Canvas: por padrão ocupa 100% do container via absolute (preenche) */
    canvas {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* ========================
       POSICIONAMENTO GRID (cards grandes)
    ======================== */
    .div5 { grid-column: 1 / 3; grid-row: 2 / 4; }
    .div6 { grid-column: 3 / 5; grid-row: 2 / 4; }

    /* ========================
       MEDIA QUERY: telas grandes (desktop)
       - aqui forçamos full-screen (sem rolagem) quando houver espaço
    ======================== */
    @media (min-width: 901px) {
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .container { width: 94vw; height: 92vh; padding: 24px 30px; }
      /* calcular grid para ocupar o restante sem rolagem */
      .parent { height: calc(92vh - 185px); }
      .chart-container { min-height: 0; } /* charts preencherão o espaço do grid */
    }

    /* ========================
       MEDIA QUERY: tablets e celulares (≤ 900px)
       - empilha tudo em 1 coluna, permite rolagem, ajusta tamanhos
    ======================== */
    @media (max-width: 900px) {

      /* container permite rolagem natural do dispositivo (melhor UX mobile) */
      .container { padding: 14px 12px; }

      /* filtros empilham e ocupam 100% */
      .filtros {
        flex-wrap: wrap;
        gap: 12px;
      }
      .filtro { min-width: 0; width: 100%; }

      /* grid vira 1 coluna — cada card fica empilhado */
      .parent {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 12px;
        height: auto; /* permite rolagem */
      }

      /* cards grandes ocupam toda largura (removemos span) */
      .div5, .div6 { grid-column: auto; grid-row: auto; }

      /* gráfico recebe altura fixa, e canvas deixa de ser absolute
         (isso evita que o canvas tente preencher um container com altura 0) */
      .chart-container { position: relative; min-height: 260px; }
      canvas { position: relative; height: auto !important; }

      /* select ocupa largura completa */
      select { width: 100%; box-sizing: border-box; }

      /* KPI fontes levemente menores para caber melhor */
      .kpi h2 { font-size: 20px; }
      .kpi span { font-size: 10px; }
    }

    /* ========================
       MEDIA QUERY: telas muito pequenas (≤ 420px)
       - ainda mais otimização (tamanho de textos e gaps)
    ======================== */
    @media (max-width: 420px) {
      .container { padding: 12px; }
      .filtros { gap: 8px; }
      .chart-container { min-height: 200px; }
      .kpi h2 { font-size: 18px; }
      .kpi span { font-size: 9px; }
    }

  </style>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('dashboard-theme') === 'dark' ? 'dark' : 'light'
    } catch (error) {
      console.error('Não foi possível carregar o tema salvo', error)
    }
  </script>
</head>

<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <h2><i class="fa-solid fa-chart-line"></i> Dashboard Comercial</h2>
        <p id="ultimaAtualizacao">Carregando...</p>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Ativar modo escuro" aria-pressed="false">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
        <span class="sr-only">Alternar tema</span>
      </button>
    </div>

    <!-- Filtros -->
    <div class="filtros">
      <div class="filtro">
        <label><i class="fa-solid fa-map"></i> Região</label>
        <select id="filtroRegiao"><option value="all">Todas</option></select>
      </div>

      <div class="filtro">
        <label><i class="fa-solid fa-user"></i> Vendedor</label>
        <select id="filtroVendedor"><option value="all">Todos</option></select>
      </div>
    </div>

    <!-- Grid -->
    <div class="parent">

      <!-- KPIs -->
      <div class="card kpi">
        <span><i class="fa-solid fa-dollar-sign"></i> Total de Vendas</span>
        <h2 id="kpiTotal">R$ 0,00</h2>
      </div>

      <div class="card kpi">
        <span><i class="fa-solid fa-box"></i> Pedidos</span>
        <h2 id="kpiPedidos">0</h2>
      </div>

      <div class="card kpi">
        <span><i class="fa-solid fa-trophy"></i> Melhor Vendedor</span>
        <h2 id="kpiTopVendedor">-</h2>
      </div>

      <div class="card kpi">
        <span><i class="fa-solid fa-receipt"></i> Ticket Médio</span>
        <h2 id="kpiTicket">R$ 0,00</h2>
      </div>

      <!-- Gráficos -->
      <div class="card div5">
        <h4>Vendas por Vendedor</h4>
        <div class="chart-container"><canvas id="grafico"></canvas></div>
      </div>

      <div class="card div6">
        <h4>Vendas por Mês</h4>
        <div class="chart-container"><canvas id="graficoMes"></canvas></div>
      </div>

    </div>
  </div>

  <script>
    /* ========================
       Código JS (igual ao seu, com pequenas melhorias)
       - mantém filtros, KPIs e comportamento de clique
    ========================= */

    let dados = []
    let chart, chartMes
    let vendedorSelecionado = null

    const themeToggle = document.getElementById('themeToggle')

    function atualizarControleTema() {
      const modoEscuro = document.documentElement.dataset.theme === 'dark'
      themeToggle.querySelector('i').className = modoEscuro ? 'fa-solid fa-sun' : 'fa-solid fa-moon'
      const label = modoEscuro ? 'Ativar modo claro' : 'Ativar modo escuro'
      themeToggle.setAttribute('aria-label', label)
      themeToggle.setAttribute('aria-pressed', String(modoEscuro))
      themeToggle.dataset.tooltip = label
    }

    themeToggle.addEventListener('click', () => {
      const proximoTema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'

      try {
        localStorage.setItem('dashboard-theme', proximoTema)
      } catch (error) {
        console.error('Não foi possível salvar o tema selecionado', error)
        return
      }

      document.documentElement.dataset.theme = proximoTema
      atualizarControleTema()
      aplicarFiltros()
    })

    atualizarControleTema()

    // Carregar JSON processado gerado pelo ETL
    fetch('data.json').then(r => r.json()).then(json => {
      document.getElementById('ultimaAtualizacao').innerText = "Última atualização: " + json.atualizado_em
      dados = json.dados || []
      preencherFiltros(dados)
      aplicarFiltros()
    }).catch(err => {
      console.error('Erro ao carregar data.json', err)
      document.getElementById('ultimaAtualizacao').innerText = "Erro ao carregar dados"
    })

    function preencherFiltros(d){
      const regioes = [...new Set(d.map(x=>x.regiao))]
      const vendedores = [...new Set(d.map(x=>x.vendedor))]

      const selectRegiao = document.getElementById('filtroRegiao')
      const selectVendedor = document.getElementById('filtroVendedor')

      regioes.forEach(r=>{
        const opt = document.createElement('option'); opt.value = r; opt.text = r; selectRegiao.appendChild(opt)
      })
      vendedores.forEach(v=>{
        const opt = document.createElement('option'); opt.value = v; opt.text = v; selectVendedor.appendChild(opt)
      })
    }

    document.getElementById('filtroRegiao').addEventListener('change', ()=>{
      vendedorSelecionado = null
      aplicarFiltros()
    })
    document.getElementById('filtroVendedor').addEventListener('change', ()=>{
      vendedorSelecionado = null
      aplicarFiltros()
    })

    function aplicarFiltros(){
      const regiao = document.getElementById('filtroRegiao').value
      const vendedorFiltro = document.getElementById('filtroVendedor').value

      let filtrado = dados.filter(d => (regiao === 'all' || d.regiao === regiao) && (vendedorFiltro === 'all' || d.vendedor === vendedorFiltro))

      // aplica filtro do clique (toggle)
      if(vendedorSelecionado) filtrado = filtrado.filter(d => d.vendedor === vendedorSelecionado)

      atualizarTudo(filtrado)
    }

    function atualizarTudo(d){
      atualizarKPIs(d)
      atualizarGraficoVendedor(d)
      atualizarGraficoMes(d)
    }

    function atualizarKPIs(d){
      const total = d.reduce((acc,x)=>acc + (Number(x.total)||0), 0)
      const pedidos = d.length
      const ticket = pedidos ? total / pedidos : 0

      document.getElementById('kpiTotal').innerText = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(total)
      document.getElementById('kpiPedidos').innerText = pedidos
      document.getElementById('kpiTicket').innerText = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(ticket)

      const resumo = {}
      d.forEach(x => { resumo[x.vendedor] = (resumo[x.vendedor]||0) + (Number(x.total)||0) })
      const top = Object.entries(resumo).sort((a,b)=>b[1]-a[1])[0]
      document.getElementById('kpiTopVendedor').innerText = top ? top[0] : "-"
    }

    function exibirTooltipGrafico({ chart, tooltip }) {
      const container = chart.canvas.parentElement
      let element = container.querySelector('.chartjs-tooltip')

      if (!element) {
        element = document.createElement('div')
        element.className = 'chartjs-tooltip'
        element.setAttribute('aria-hidden', 'true')
        container.appendChild(element)
      }

      if (tooltip.opacity === 0) {
        element.style.opacity = 0
        return
      }

      element.replaceChildren()
      const title = tooltip.title.join(' ')
      if (title) {
        const titleElement = document.createElement('p')
        titleElement.className = 'chartjs-tooltip-title'
        titleElement.textContent = title
        element.appendChild(titleElement)
      }

      tooltip.dataPoints.forEach(point => {
        const valueElement = document.createElement('p')
        valueElement.className = 'chartjs-tooltip-value'
        valueElement.textContent = point.formattedValue
        element.appendChild(valueElement)
      })

      const containerRect = container.getBoundingClientRect()
      const canvasRect = chart.canvas.getBoundingClientRect()
      const left = canvasRect.left - containerRect.left + tooltip.caretX
      const top = canvasRect.top - containerRect.top + tooltip.caretY
      element.style.left = `${left}px`
      element.style.top = `${top}px`
      element.classList.toggle('is-below', tooltip.caretY < chart.height / 2)
      element.style.opacity = 1
    }

    function obterPaletaGrafico() {
      const style = getComputedStyle(document.documentElement)
      const darkMode = document.documentElement.dataset.theme === 'dark'
      const palette = [
        style.getPropertyValue('--chart-bar').trim()
      ]

      if (darkMode) {
        palette.push(
          style.getPropertyValue('--chart-bar-secondary').trim(),
          style.getPropertyValue('--chart-bar-light').trim(),
          style.getPropertyValue('--chart-bar-deep').trim()
        )
      }

      return palette
    }

    function atualizarGraficoVendedor(d){
      const resumo = {}
      d.forEach(x=> { resumo[x.vendedor] = (resumo[x.vendedor]||0) + (Number(x.total)||0) })
      const labels = Object.keys(resumo)
      const values = Object.values(resumo)
      const paleta = obterPaletaGrafico()
      const coresHover = labels.map((_, index) =>
        document.documentElement.dataset.theme === 'dark'
          ? getComputedStyle(document.documentElement).getPropertyValue('--chart-hover').trim()
          : paleta[index % paleta.length])

      const cores = labels.map((label, index) => label === vendedorSelecionado
        ? getComputedStyle(document.documentElement).getPropertyValue('--chart-selected').trim()
        : paleta[index % paleta.length])

      if(chart) {
        chart.canvas.parentElement.querySelector('.chartjs-tooltip')?.remove()
        chart.destroy()
      }

      chart = new Chart(document.getElementById('grafico'), {
        type:'bar',
        data:{
          labels: labels,
          datasets:[{
            data: values,
            backgroundColor: cores,
            hoverBackgroundColor: coresHover,
            borderRadius: 4,
            borderSkipped: false
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          font:{ family:'"SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif' },
          plugins:{
            legend:{ display:false },
            tooltip:{ enabled:false, external:exibirTooltipGrafico }
          },
          scales:{
            x:{
              ticks:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              title:{ display:true, text:'Vendedor', color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              grid:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim() },
              border:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-border').trim() }
            },
            y:{
              ticks:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              title:{ display:true, text:'Valor (R$)', color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              grid:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim() },
              border:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-border').trim() }
            }
          },
          onClick:(evt, elements) => {
            if(elements.length > 0){
              const index = elements[0].index
              const vendedor = labels[index]
              vendedorSelecionado = vendedorSelecionado === vendedor ? null : vendedor
              // sincroniza o select visual (se quiser manter seleção no select)
              document.getElementById('filtroVendedor').value = vendedorSelecionado || 'all'
              aplicarFiltros()
            }
          }
        }
      })
    }

    function atualizarGraficoMes(d){
      const resumo = {}
      d.forEach(x=> { resumo[x.mes] = (resumo[x.mes]||0) + (Number(x.total)||0) })
      const labels = Object.keys(resumo).sort((a,b)=>a-b)
      const values = labels.map(l=> resumo[l])
      const paleta = obterPaletaGrafico()
      const pontoColors = labels.map((_, index) => paleta[index % paleta.length])

      if(chartMes) {
        chartMes.canvas.parentElement.querySelector('.chartjs-tooltip')?.remove()
        chartMes.destroy()
      }

      chartMes = new Chart(document.getElementById('graficoMes'), {
        type:'line',
        data:{ labels: labels, datasets:[{ data: values, borderColor:getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim(), backgroundColor:getComputedStyle(document.documentElement).getPropertyValue('--chart-fill').trim(), pointBackgroundColor:pontoColors, pointBorderColor:getComputedStyle(document.documentElement).getPropertyValue('--chart-point-border').trim(), pointHoverBackgroundColor:getComputedStyle(document.documentElement).getPropertyValue('--chart-hover').trim(), pointHoverBorderColor:getComputedStyle(document.documentElement).getPropertyValue('--chart-point-border').trim(), tension:0.3 }]},
        options:{
          responsive:true,
          maintainAspectRatio:false,
          font:{ family:'"SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif' },
          plugins:{
            legend:{ display:false },
            tooltip:{ enabled:false, external:exibirTooltipGrafico }
          },
          scales:{
            x:{
              ticks:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              title:{ display:true, text:'Mês', color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              grid:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim() },
              border:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-border').trim() }
            },
            y:{
              ticks:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              title:{ display:true, text:'Valor (R$)', color:getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() },
              grid:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim() },
              border:{ color:getComputedStyle(document.documentElement).getPropertyValue('--chart-border').trim() }
            }
          }
        }
      })
    }

  </script>
