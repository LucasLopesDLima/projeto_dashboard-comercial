<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Comercial</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
    }

    .container {
      height: 100vh;
      padding: 15px;
      box-sizing: border-box;
    }

    /* HEADER */
    .header {
      margin-bottom: 10px;
    }

    /* FILTROS */
    .filtros {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }

    /* GRID */
    .parent {
      display: grid;
      height: calc(100% - 120px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 100px 1fr 1fr;
      gap: 12px;
    }

    /* CARDS */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 🔵 PRIMEIRA LINHA AZUL CUSTOM */
    .parent > .card:nth-child(-n+4) {
      background: rgb(17,17,132);
      color: white;
    }

    /* KPI */
    .kpi h2 {
      margin: 0;
      font-size: 24px;
    }

    /* GRÁFICOS */
    .chart-container {
      position: relative;
      flex: 1;
    }

    canvas {
      position: absolute;
      width: 100% !important;
      height: 100% !important;
    }

    /* POSIÇÃO */
    .div5 {
      grid-column: 1 / 3;
      grid-row: 2 / 4;
    }

    .div6 {
      grid-column: 3 / 5;
      grid-row: 2 / 4;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Dashboard Comercial</h2>
    <p id="ultimaAtualizacao" style="font-size: 12px; color: gray;"></p>
  </div>

  <!-- FILTROS -->
  <div class="filtros">

    <div>
      <label>Região:</label><br>
      <select id="filtroRegiao">
        <option value="all">Todas</option>
      </select>
    </div>

    <div>
      <label>Vendedor:</label><br>
      <select id="filtroVendedor">
        <option value="all">Todos</option>
      </select>
    </div>

  </div>

  <div class="parent">

    <!-- KPI TOTAL -->
    <div class="card kpi">
      <span>Total de Vendas</span>
      <h2 id="kpiTotal"></h2>
    </div>

    <!-- KPI PEDIDOS -->
    <div class="card kpi">
      <span>Pedidos</span>
      <h2 id="kpiPedidos"></h2>
    </div>

    <!-- KPI TOP -->
    <div class="card kpi">
      <span>Melhor Vendedor</span>
      <h2 id="kpiTopVendedor"></h2>
    </div>

    <!-- KPI TICKET MÉDIO -->
    <div class="card kpi">
      <span>Ticket Médio</span>
      <h2 id="kpiTicket"></h2>
    </div>

    <!-- GRÁFICO VENDEDOR -->
    <div class="card div5">
      <h4>Total de Vendas por Vendedor</h4>
      <div class="chart-container">
        <canvas id="grafico"></canvas>
      </div>
    </div>

    <!-- GRÁFICO MÊS -->
    <div class="card div6">
      <h4>Vendas por Mês</h4>
      <div class="chart-container">
        <canvas id="graficoMes"></canvas>
      </div>
    </div>

  </div>

</div>

<script>

let dados = []
let chart
let chartMes

// ========================
fetch('data.json')
  .then(res => res.json())
  .then(json => {

    document.getElementById('ultimaAtualizacao')
      .innerText = "Última atualização: " + json.atualizado_em

    dados = json.dados

    preencherFiltros(dados)
    aplicarFiltros()
  })

// ========================
function preencherFiltros(d){

  const regioes = [...new Set(d.map(x=>x.regiao))]
  const vendedores = [...new Set(d.map(x=>x.vendedor))]

  const selectRegiao = document.getElementById('filtroRegiao')
  const selectVendedor = document.getElementById('filtroVendedor')

  regioes.forEach(r=>{
    let opt = document.createElement('option')
    opt.value = r
    opt.text = r
    selectRegiao.appendChild(opt)
  })

  vendedores.forEach(v=>{
    let opt = document.createElement('option')
    opt.value = v
    opt.text = v
    selectVendedor.appendChild(opt)
  })
}

// ========================
document.getElementById('filtroRegiao').addEventListener('change', aplicarFiltros)
document.getElementById('filtroVendedor').addEventListener('change', aplicarFiltros)

// ========================
function aplicarFiltros(){

  let regiao = document.getElementById('filtroRegiao').value
  let vendedor = document.getElementById('filtroVendedor').value

  let filtrado = dados.filter(d => {
    return (regiao === 'all' || d.regiao === regiao) &&
           (vendedor === 'all' || d.vendedor === vendedor)
  })

  atualizarTudo(filtrado)
}

// ========================
function atualizarTudo(d){
  atualizarKPIs(d)
  atualizarGraficoVendedor(d)
  atualizarGraficoMes(d)
}

// ========================
function atualizarKPIs(d){

  const total = d.reduce((acc,x)=>acc+x.total,0)
  const pedidos = d.length
  const ticket = pedidos ? total / pedidos : 0

  document.getElementById('kpiTotal')
    .innerText = "R$ " + total.toLocaleString('pt-BR')

  document.getElementById('kpiPedidos')
    .innerText = pedidos

  document.getElementById('kpiTicket')
    .innerText = "R$ " + ticket.toFixed(2)

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.vendedor]) resumo[x.vendedor]=0
    resumo[x.vendedor]+=x.total
  })

  let top = Object.entries(resumo)
    .sort((a,b)=>b[1]-a[1])[0]

  document.getElementById('kpiTopVendedor')
    .innerText = top ? top[0] : "-"
}

// ========================
function atualizarGraficoVendedor(d){

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.vendedor]) resumo[x.vendedor]=0
    resumo[x.vendedor]+=x.total
  })

  if(chart) chart.destroy()

  chart = new Chart(grafico,{
    type:'bar',
    data:{
      labels:Object.keys(resumo),
      datasets:[{
        label:'Vendas',
        data:Object.values(resumo),
        backgroundColor:'rgb(17,17,132)'
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false
    }
  })
}

// ========================
function atualizarGraficoMes(d){

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.mes]) resumo[x.mes]=0
    resumo[x.mes]+=x.total
  })

  let labels = Object.keys(resumo).sort((a,b)=>a-b)

  if(chartMes) chartMes.destroy()

  chartMes = new Chart(graficoMes,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:'Vendas por mês',
        data:labels.map(l=>resumo[l]),
        borderColor:'rgb(17,17,132)',
        backgroundColor:'rgba(17,17,132,0.2)',
        tension:0.3
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false
    }
  })
}

</script>

</body>
</html>
