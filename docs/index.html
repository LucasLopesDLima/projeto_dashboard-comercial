<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Comercial</title>

  <!-- Biblioteca de gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    /* ========================
       ESTILO GLOBAL
    ======================== */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f6fa;
    }

    /* Centraliza o dashboard */
    .container {
      max-width: 1100px;
      margin: auto;
    }

    /* ========================
       GRID PRINCIPAL
       4 colunas / 3 linhas
       Linha 1 = KPIs
       Linha 2 e 3 = gráficos grandes
    ======================== */
    .parent {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 120px 300px 300px;
      gap: 12px;
    }

    /* ========================
       CARDS (visual padrão)
    ======================== */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* ========================
       KPI (Card 1)
    ======================== */
    .div1 {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .div1 h2 {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
    }

    /* ========================
       CARDS "EM BREVE"
    ======================== */
    .div3, .div4 {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #999;
      font-style: italic;
    }

    /* ========================
       GRÁFICOS GRANDES
    ======================== */
    .div5 {
      grid-column: span 2;
      grid-row: span 2;
      grid-row-start: 2;
    }

    .div6 {
      grid-column: span 2;
      grid-row: span 2;
      grid-column-start: 3;
      grid-row-start: 2;
    }

    /* ========================
       CANVAS RESPONSIVO
       (sem usar !important)
    ======================== */
    .card canvas {
      width: 100%;
      height: 100%;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>Dashboard Comercial</h2>

  <!-- Última atualização vinda do ETL -->
  <p id="ultimaAtualizacao" style="color: gray; font-size: 12px;"></p>

  <!-- GRID -->
  <div class="parent">

    <!-- CARD 1 → KPI -->
    <div class="card div1">
      <h4>Total de Vendas</h4>
      <h2 id="kpiTotal"></h2>
    </div>

    <!-- CARD 2 → FILTRO -->
    <div class="card div2">
      <label>Filtrar por Região:</label><br><br>
      <select id="filtroRegiao">
        <option value="all">Todas</option>
      </select>
    </div>

    <!-- CARD 3 -->
    <div class="card div3">Em breve</div>

    <!-- CARD 4 -->
    <div class="card div4">Em breve</div>

    <!-- CARD 5 → GRÁFICO VENDEDOR -->
    <div class="card div5">
      <h4>Total de Vendas por Vendedor</h4>
      <canvas id="grafico"></canvas>
    </div>

    <!-- CARD 6 → GRÁFICO MÊS -->
    <div class="card div6">
      <h4>Vendas por Mês</h4>
      <canvas id="graficoMes"></canvas>
    </div>

  </div>

</div>

<script>

// ========================
// VARIÁVEIS GLOBAIS
// ========================
let dados = []
let chart
let chartMes

// ========================
// CARREGAR DADOS (JSON do ETL)
// ========================
fetch('data.json')
  .then(res => res.json())
  .then(json => {

    // 🕒 Data da última atualização
    document.getElementById('ultimaAtualizacao')
      .innerText = "Última atualização: " + json.atualizado_em

    // 📊 Dados tratados no Python
    dados = json.dados

    // ========================
    // KPI TOTAL
    // Soma de todas as vendas
    // ========================
    const totalGeral = dados.reduce((acc, d) => acc + d.total, 0)

    document.getElementById('kpiTotal')
      .innerText = "R$ " + totalGeral.toLocaleString('pt-BR')

    // ========================
    // FILTRO DINÂMICO
    // ========================
    const regioes = [...new Set(dados.map(d => d.regiao))]
    const select = document.getElementById('filtroRegiao')

    regioes.forEach(r => {
      let option = document.createElement('option')
      option.value = r
      option.text = r
      select.appendChild(option)
    })

    // Render inicial
    atualizarGraficos('all')
  })

// ========================
// EVENTO DO FILTRO
// ========================
document.getElementById('filtroRegiao')
  .addEventListener('change', (e) => {
    atualizarGraficos(e.target.value)
  })

// ========================
// FUNÇÃO PRINCIPAL
// ========================
function atualizarGraficos(regiao) {

  let filtrado = regiao === 'all'
    ? dados
    : dados.filter(d => d.regiao === regiao)

  atualizarGraficoVendedor(filtrado)
  atualizarGraficoMes(filtrado)
}

// ========================
// GRÁFICO 1 (VENDEDOR)
// ========================
function atualizarGraficoVendedor(dadosFiltrados) {

  let resumo = {}

  dadosFiltrados.forEach(d => {
    if (!resumo[d.vendedor]) {
      resumo[d.vendedor] = 0
    }
    resumo[d.vendedor] += d.total
  })

  let labels = Object.keys(resumo)
  let valores = Object.values(resumo)

  if (chart) chart.destroy()

  chart = new Chart(document.getElementById('grafico'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Total de Vendas',
        data: valores
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  })
}

// ========================
// GRÁFICO 2 (MÊS)
// ========================
function atualizarGraficoMes(dadosFiltrados) {

  let resumoMes = {}

  dadosFiltrados.forEach(d => {
    if (!resumoMes[d.mes]) {
      resumoMes[d.mes] = 0
    }
    resumoMes[d.mes] += d.total
  })

  let labels = Object.keys(resumoMes).sort((a,b) => a-b)
  let valores = labels.map(l => resumoMes[l])

  if (chartMes) chartMes.destroy()

  chartMes = new Chart(document.getElementById('graficoMes'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Vendas por Mês',
        data: valores
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  })
}

</script>

</body>
</html>
