<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Comercial</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Ícones (Font Awesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>

    /* ========================
       BASE / LAYOUT GLOBAL
    ======================== */

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;

      /* 🔥 Fundo mais escuro (melhor contraste) */
      background: #1e1e2f;
      color: #333;
    }

    .container {
      height: 100vh;

      /* 🔥 Espaçamento lateral (respiro visual) */
      padding: 20px 30px;

      box-sizing: border-box;
    }

    /* ========================
       HEADER
    ======================== */

    .header h2 {
      margin: 0;
      color: white;
      text-transform: uppercase;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 12px;
      color: #bbb;
      text-transform: uppercase;
    }

    /* ========================
       FILTROS
    ======================== */

    .filtros {
      display: flex;
      gap: 30px;
      margin: 18px 0;
      color: white;
      align-items: flex-end;
    }

    .filtro {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 180px;
    }

    .filtro label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      min-height: 18px;
      text-transform: uppercase;
    }

    select {
      width: 180px;
      height: 38px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      box-sizing: border-box;
      font-size: 14px;
      color: #1e1e2f;
      background: white;
    }

    /* ========================
       GRID PRINCIPAL
    ======================== */

    .parent {
      display: grid;

      /* 🔥 ocupa tela inteira sem scroll */
      height: calc(100% - 130px);

      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 96px 1fr 1fr;
      gap: 15px;
    }

    /* ========================
       CARDS
    ======================== */

    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;

      /* sombra mais suave */
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);

      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 🔵 LINHA DE KPI */
    .parent > .card:nth-child(-n+4) {
      background: white;
      color: #1e1e2f;
    }

    /* ========================
       KPI
    ======================== */

    .kpi {
      justify-content: center;
      gap: 7px;
      padding: 12px 14px;
    }

    .kpi span {
      font-size: 11px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      line-height: 1.15;
    }

    .kpi h2 {
      margin: 0;
      font-size: 19px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
    }

    .kpi i {
      margin-right: 6px;
    }

    /* ========================
       GRÁFICOS
    ======================== */

    .chart-container {
      position: relative;
      flex: 1;
    }

    .card h4 {
      text-transform: uppercase;
      margin: 0 0 10px 0;
    }

    canvas {
      position: absolute;
      width: 100% !important;
      height: 100% !important;
    }

    /* ========================
       POSICIONAMENTO GRID
    ======================== */

    .div5 {
      grid-column: 1 / 3;
      grid-row: 2 / 4;
    }

    .div6 {
      grid-column: 3 / 5;
      grid-row: 2 / 4;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- ========================
       HEADER
  ======================== -->
  <div class="header">
    <h2><i class="fa-solid fa-chart-line"></i> Dashboard Comercial</h2>
    <p id="ultimaAtualizacao"></p>
  </div>

  <!-- ========================
       FILTROS
  ======================== -->
  <div class="filtros">

    <div class="filtro">
      <label><i class="fa-solid fa-map"></i> Região</label>
      <select id="filtroRegiao">
        <option value="all">Todas</option>
      </select>
    </div>

    <div class="filtro">
      <label><i class="fa-solid fa-user"></i> Vendedor</label>
      <select id="filtroVendedor">
        <option value="all">Todos</option>
      </select>
    </div>

  </div>

  <!-- ========================
       GRID
  ======================== -->
  <div class="parent">

    <!-- KPI TOTAL -->
    <div class="card kpi">
      <span><i class="fa-solid fa-dollar-sign"></i> Total de Vendas</span>
      <h2 id="kpiTotal"></h2>
    </div>

    <!-- KPI PEDIDOS -->
    <div class="card kpi">
      <span><i class="fa-solid fa-box"></i> Pedidos</span>
      <h2 id="kpiPedidos"></h2>
    </div>

    <!-- KPI TOP -->
    <div class="card kpi">
      <span><i class="fa-solid fa-trophy"></i> Melhor Vendedor</span>
      <h2 id="kpiTopVendedor"></h2>
    </div>

    <!-- KPI TICKET -->
    <div class="card kpi">
      <span><i class="fa-solid fa-receipt"></i> Ticket Médio</span>
      <h2 id="kpiTicket"></h2>
    </div>

    <!-- GRÁFICO VENDEDOR -->
    <div class="card div5">
      <h4>Vendas por Vendedor</h4>
      <div class="chart-container">
        <canvas id="grafico"></canvas>
      </div>
    </div>

    <!-- GRÁFICO MÊS -->
    <div class="card div6">
      <h4>Vendas por Mês</h4>
      <div class="chart-container">
        <canvas id="graficoMes"></canvas>
      </div>
    </div>

  </div>

</div>

<script>

/* ========================
   ESTADO GLOBAL
======================== */
let dados = []
let chart
let chartMes

// 🔥 Guarda filtro por clique (efeito Power BI)
let vendedorSelecionado = null

/* ========================
   CARREGAR DADOS
======================== */
fetch('data.json')
  .then(res => res.json())
  .then(json => {

    // Mostrar data do ETL
    document.getElementById('ultimaAtualizacao')
      .innerText = "Última atualização: " + json.atualizado_em

    dados = json.dados

    preencherFiltros(dados)
    aplicarFiltros()
  })

/* ========================
   PREENCHER FILTROS
======================== */
function preencherFiltros(d){

  const regioes = [...new Set(d.map(x=>x.regiao))]
  const vendedores = [...new Set(d.map(x=>x.vendedor))]

  const selectRegiao = document.getElementById('filtroRegiao')
  const selectVendedor = document.getElementById('filtroVendedor')

  regioes.forEach(r=>{
    let opt = document.createElement('option')
    opt.value = r
    opt.text = r
    selectRegiao.appendChild(opt)
  })

  vendedores.forEach(v=>{
    let opt = document.createElement('option')
    opt.value = v
    opt.text = v
    selectVendedor.appendChild(opt)
  })
}

/* ========================
   EVENTOS DOS FILTROS
======================== */
document.getElementById('filtroRegiao').addEventListener('change', ()=>{
  vendedorSelecionado = null
  aplicarFiltros()
})

document.getElementById('filtroVendedor').addEventListener('change', ()=>{
  vendedorSelecionado = null
  aplicarFiltros()
})

/* ========================
   APLICAR FILTROS
======================== */
function aplicarFiltros(){

  let regiao = document.getElementById('filtroRegiao').value
  let vendedor = document.getElementById('filtroVendedor').value

  let filtrado = dados.filter(d => {
    return (regiao === 'all' || d.regiao === regiao) &&
           (vendedor === 'all' || d.vendedor === vendedor)
  })

  // 🔥 filtro por clique no gráfico
  if(vendedorSelecionado){
    filtrado = filtrado.filter(d => d.vendedor === vendedorSelecionado)
  }

  atualizarTudo(filtrado)
}

/* ========================
   ATUALIZA TUDO
======================== */
function atualizarTudo(d){
  atualizarKPIs(d)
  atualizarGraficoVendedor(d)
  atualizarGraficoMes(d)
}

/* ========================
   KPIs
======================== */
function atualizarKPIs(d){

  const total = d.reduce((acc,x)=>acc+x.total,0)
  const pedidos = d.length
  const ticket = pedidos ? total / pedidos : 0

  document.getElementById('kpiTotal')
    .innerText = new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    }).format(total)

  document.getElementById('kpiPedidos')
    .innerText = pedidos

  document.getElementById('kpiTicket')
    .innerText = new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    }).format(ticket)

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.vendedor]) resumo[x.vendedor]=0
    resumo[x.vendedor]+=x.total
  })

  let top = Object.entries(resumo)
    .sort((a,b)=>b[1]-a[1])[0]

  document.getElementById('kpiTopVendedor')
    .innerText = top ? top[0] : "-"
}

/* ========================
   GRÁFICO VENDEDOR
======================== */
function atualizarGraficoVendedor(d){

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.vendedor]) resumo[x.vendedor]=0
    resumo[x.vendedor]+=x.total
  })

  let labels = Object.keys(resumo)

  // 🔥 destaque visual do selecionado
  let cores = labels.map(l =>
    l === vendedorSelecionado
      ? '#f97316'
      : 'rgb(17,17,132)'
  )

  if(chart) chart.destroy()

  chart = new Chart(grafico,{
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        data:Object.values(resumo),
        backgroundColor:cores
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          display:false
        }
      },
      scales:{
        x:{
          title:{
            display:true,
            text:'Vendedor',
            color:'#1e1e2f',
            font:{ weight:'bold' }
          },
          ticks:{ color:'#1e1e2f' }
        },
        y:{
          title:{
            display:true,
            text:'Valor (R$)',
            color:'#1e1e2f',
            font:{ weight:'bold' }
          },
          ticks:{ color:'#1e1e2f' }
        }
      },

      // 🔥 clique estilo Power BI
      onClick: (evt, elements) => {
        if(elements.length > 0){
          const index = elements[0].index
          const vendedor = labels[index]

          vendedorSelecionado =
            vendedorSelecionado === vendedor ? null : vendedor

          aplicarFiltros()
        }
      }
    }
  })
}

/* ========================
   GRÁFICO MÊS
======================== */
function atualizarGraficoMes(d){

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.mes]) resumo[x.mes]=0
    resumo[x.mes]+=x.total
  })

  let labels = Object.keys(resumo).sort((a,b)=>a-b)

  if(chartMes) chartMes.destroy()

  chartMes = new Chart(graficoMes,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        data:labels.map(l=>resumo[l]),
        borderColor:'rgb(17,17,132)',
        backgroundColor:'rgba(17,17,132,0.2)',
        tension:0.3
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          display:false
        }
      },
      scales:{
        x:{
          title:{
            display:true,
            text:'Mês',
            color:'#1e1e2f',
            font:{ weight:'bold' }
          },
          ticks:{ color:'#1e1e2f' }
        },
        y:{
          title:{
            display:true,
            text:'Valor (R$)',
            color:'#1e1e2f',
            font:{ weight:'bold' }
          },
          ticks:{ color:'#1e1e2f' }
        }
      }
    }
  })
}

</script>

</body>
</html>
