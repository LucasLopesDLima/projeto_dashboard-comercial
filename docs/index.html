<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Comercial</title>

  <!-- Biblioteca de gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ========================
       ESTILO GLOBAL
    ======================== */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f6fa;
    }

    h2 {
      margin-bottom: 5px;
    }

    /* KPI principal */
    #kpiTotal {
      margin-top: 5px;
      margin-bottom: 20px;
    }

    /* Container central do dashboard */
    .container {
      max-width: 900px;
      margin: auto;
    }

    /* "Card" dos gráficos */
    .chart-container {
      width: 100%;
      height: 300px;
      margin-bottom: 30px;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<!-- Container principal -->
<div class="container">

  <!-- Título -->
  <h2>Vendas por Vendedor</h2>

  <!-- Última atualização -->
  <p id="ultimaAtualizacao" style="color: gray; font-size: 12px;"></p>

  <!-- KPI -->
  <h3 id="kpiTotal"></h3>

  <!-- Filtro -->
  <label>Filtrar por Região:</label>
  <select id="filtroRegiao">
    <option value="all">Todas</option>
  </select>

  <br><br>

  <!-- Gráfico 1 -->
  <div class="chart-container">
    <canvas id="grafico"></canvas>
  </div>

  <!-- Gráfico 2 -->
  <div class="chart-container">
    <canvas id="graficoMes"></canvas>
  </div>

</div>

<script>

// ========================
// VARIÁVEIS GLOBAIS
// ========================
let dados = []        // Armazena os dados do JSON
let chart             // Gráfico por vendedor
let chartMes          // Gráfico por mês

// ========================
// CARREGAR DADOS (API local JSON)
// ========================
fetch('data.json')
  .then(res => res.json())
  .then(json => {

    // 🕒 Mostrar data de atualização
    document.getElementById('ultimaAtualizacao')
      .innerText = "Última atualização: " + json.atualizado_em

    // 📊 Dados vindos do ETL
    dados = json.dados

    // ========================
    // KPI TOTAL (soma geral)
    // ========================
    const totalGeral = dados.reduce((acc, d) => acc + d.total, 0)

    document.getElementById('kpiTotal')
      .innerText = "Total de Vendas: R$ " + totalGeral.toLocaleString('pt-BR')

    // ========================
    // PREENCHER FILTRO DINAMICAMENTE
    // ========================
    const regioes = [...new Set(dados.map(d => d.regiao))]
    const select = document.getElementById('filtroRegiao')

    regioes.forEach(r => {
      let option = document.createElement('option')
      option.value = r
      option.text = r
      select.appendChild(option)
    })

    // Render inicial
    atualizarGraficos('all')
  })

// ========================
// EVENTO DO FILTRO
// ========================
document.getElementById('filtroRegiao')
  .addEventListener('change', (e) => {
    atualizarGraficos(e.target.value)
  })

// ========================
// FUNÇÃO PRINCIPAL (orquestra tudo)
// ========================
function atualizarGraficos(regiao) {

  // Filtrar dados
  let filtrado = regiao === 'all'
    ? dados
    : dados.filter(d => d.regiao === regiao)

  // Atualizar gráficos
  atualizarGraficoVendedor(filtrado)
  atualizarGraficoMes(filtrado)
}

// ========================
// GRÁFICO 1 — VENDEDOR
// ========================
function atualizarGraficoVendedor(dadosFiltrados) {

  let resumo = {}

  // Agrupar vendas por vendedor
  dadosFiltrados.forEach(d => {
    if (!resumo[d.vendedor]) {
      resumo[d.vendedor] = 0
    }
    resumo[d.vendedor] += d.total
  })

  let labels = Object.keys(resumo)
  let valores = Object.values(resumo)

  // Evita sobreposição
  if (chart) chart.destroy()

  chart = new Chart(document.getElementById('grafico'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Total de Vendas',
        data: valores
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  })
}

// ========================
// GRÁFICO 2 — POR MÊS
// ========================
function atualizarGraficoMes(dadosFiltrados) {

  let resumoMes = {}

  // Agrupar por mês
  dadosFiltrados.forEach(d => {
    if (!resumoMes[d.mes]) {
      resumoMes[d.mes] = 0
    }
    resumoMes[d.mes] += d.total
  })

  // Ordenar meses corretamente
  let labels = Object.keys(resumoMes).sort((a,b) => a-b)
  let valores = labels.map(l => resumoMes[l])

  if (chartMes) chartMes.destroy()

  chartMes = new Chart(document.getElementById('graficoMes'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Vendas por Mês',
        data: valores
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  })
}

</script>

</body>
</html>
