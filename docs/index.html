<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Comercial</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial;
      background: #f5f6fa;
    }

    .container {
      height: 100vh;
      padding: 15px;
      box-sizing: border-box;
    }

    .header {
      margin-bottom: 10px;
    }

    .filtros {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }

    .parent {
      display: grid;
      height: calc(100% - 120px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 100px 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOPO AZUL */
    .parent > .card:nth-child(-n+4) {
      background: rgb(17,17,132);
      color: white;
    }

    .chart-container {
      position: relative;
      flex: 1;
    }

    canvas {
      position: absolute;
      width: 100% !important;
      height: 100% !important;
    }

    .div5 {
      grid-column: 1 / 3;
      grid-row: 2 / 4;
    }

    .div6 {
      grid-column: 3 / 5;
      grid-row: 2 / 4;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Dashboard Comercial</h2>
    <p id="ultimaAtualizacao"></p>
  </div>

  <div class="filtros">
    <div>
      <label>Região</label><br>
      <select id="filtroRegiao">
        <option value="all">Todas</option>
      </select>
    </div>

    <div>
      <label>Vendedor</label><br>
      <select id="filtroVendedor">
        <option value="all">Todos</option>
      </select>
    </div>
  </div>

  <div class="parent">

    <div class="card">
      <span>Total</span>
      <h2 id="kpiTotal"></h2>
    </div>

    <div class="card">
      <span>Pedidos</span>
      <h2 id="kpiPedidos"></h2>
    </div>

    <div class="card">
      <span>Melhor Vendedor</span>
      <h2 id="kpiTop"></h2>
    </div>

    <div class="card">
      <span>Ticket Médio</span>
      <h2 id="kpiTicket"></h2>
    </div>

    <div class="card div5">
      <h4>Vendas por Vendedor</h4>
      <div class="chart-container">
        <canvas id="grafico"></canvas>
      </div>
    </div>

    <div class="card div6">
      <h4>Vendas por Mês</h4>
      <div class="chart-container">
        <canvas id="graficoMes"></canvas>
      </div>
    </div>

  </div>
</div>

<script>

let dados = []
let chart
let chartMes

let filtroSelecionadoRegiao = 'all'
let filtroSelecionadoVendedor = 'all'

// ========================
fetch('data.json')
  .then(res => res.json())
  .then(json => {

    document.getElementById('ultimaAtualizacao')
      .innerText = "Atualizado: " + json.atualizado_em

    dados = json.dados

    preencherFiltros()
    aplicarFiltros()
  })

// ========================
function preencherFiltros(){

  let regioes = [...new Set(dados.map(d=>d.regiao))]
  let vendedores = [...new Set(dados.map(d=>d.vendedor))]

  regioes.forEach(r=>{
    let opt = document.createElement('option')
    opt.value = r
    opt.text = r
    filtroRegiao.appendChild(opt)
  })

  vendedores.forEach(v=>{
    let opt = document.createElement('option')
    opt.value = v
    opt.text = v
    filtroVendedor.appendChild(opt)
  })
}

// ========================
filtroRegiao.addEventListener('change', e=>{
  filtroSelecionadoRegiao = e.target.value
  aplicarFiltros()
})

filtroVendedor.addEventListener('change', e=>{
  filtroSelecionadoVendedor = e.target.value
  aplicarFiltros()
})

// ========================
function aplicarFiltros(){

  let filtrado = dados.filter(d=>{
    return (filtroSelecionadoRegiao === 'all' || d.regiao === filtroSelecionadoRegiao) &&
           (filtroSelecionadoVendedor === 'all' || d.vendedor === filtroSelecionadoVendedor)
  })

  atualizarTudo(filtrado)
}

// ========================
function atualizarTudo(d){
  atualizarKPIs(d)
  atualizarGraficoVendedor(d)
  atualizarGraficoMes(d)
}

// ========================
function atualizarKPIs(d){

  let total = d.reduce((a,b)=>a+b.total,0)
  let pedidos = d.length
  let ticket = pedidos ? total/pedidos : 0

  kpiTotal.innerText = "R$ " + total.toLocaleString('pt-BR')
  kpiPedidos.innerText = pedidos
  kpiTicket.innerText = "R$ " + ticket.toFixed(2)

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.vendedor]) resumo[x.vendedor]=0
    resumo[x.vendedor]+=x.total
  })

  let top = Object.entries(resumo).sort((a,b)=>b[1]-a[1])[0]
  kpiTop.innerText = top ? top[0] : "-"
}

// ========================
function atualizarGraficoVendedor(d){

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.vendedor]) resumo[x.vendedor]=0
    resumo[x.vendedor]+=x.total
  })

  let labels = Object.keys(resumo)
  let valores = Object.values(resumo)

  // 🎯 Highlight da seleção
  let cores = labels.map(l =>
    l === filtroSelecionadoVendedor
      ? 'rgba(17,17,132,1)'
      : 'rgba(17,17,132,0.3)'
  )

  if(chart) chart.destroy()

  chart = new Chart(grafico,{
    type:'bar',
    data:{
      labels: labels,
      datasets:[{
        data: valores,
        backgroundColor: cores
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,

      onClick:(evt, elements)=>{

        if(elements.length > 0){

          let index = elements[0].index
          let vendedor = labels[index]

          if(filtroSelecionadoVendedor === vendedor){
            filtroSelecionadoVendedor = 'all'
          } else {
            filtroSelecionadoVendedor = vendedor
          }

          filtroVendedor.value = filtroSelecionadoVendedor
          aplicarFiltros()
        }
      }
    }
  })
}

// ========================
function atualizarGraficoMes(d){

  let resumo = {}
  d.forEach(x=>{
    if(!resumo[x.mes]) resumo[x.mes]=0
    resumo[x.mes]+=x.total
  })

  let labels = Object.keys(resumo).sort((a,b)=>a-b)

  if(chartMes) chartMes.destroy()

  chartMes = new Chart(graficoMes,{
    type:'line',
    data:{
      labels: labels,
      datasets:[{
        data: labels.map(l=>resumo[l]),
        borderColor:'rgb(17,17,132)',
        backgroundColor:'rgba(17,17,132,0.2)',
        tension:0.3
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false
    }
  })
}

</script>

</body>
</html>
