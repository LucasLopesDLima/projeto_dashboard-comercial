<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Comercial</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f6fa;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    /* ========================
       GRID PRINCIPAL
    ======================== */
    .parent {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 120px 350px 350px;
      gap: 12px;
    }

    /* ========================
       CARDS
    ======================== */
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    /* KPI */
    .kpi h2 {
      margin: 0;
      font-size: 26px;
      color: #2c3e50;
    }

    .kpi span {
      color: #888;
      font-size: 12px;
    }

    /* ========================
       GRÁFICOS
    ======================== */
    .chart-card {
      padding: 15px;
    }

    .chart-container {
      position: relative;
      flex-grow: 1;
    }

    canvas {
      position: absolute;
      width: 100% !important;
      height: 100% !important;
    }

    /* ========================
       GRID POSICIONAMENTO
    ======================== */
    .div5 {
      grid-column: 1 / 3;
      grid-row: 2 / 4;
    }

    .div6 {
      grid-column: 3 / 5;
      grid-row: 2 / 4;
    }

    /* ========================
       FILTRO (FORA DO CARD)
    ======================== */
    .filtro {
      margin: 15px 0;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>Dashboard Comercial</h2>
  <p id="ultimaAtualizacao" style="color: gray; font-size: 12px;"></p>

  <!-- FILTRO FORA DO GRID -->
  <div class="filtro">
    <label>Filtrar por Região:</label>
    <select id="filtroRegiao">
      <option value="all">Todas</option>
    </select>
  </div>

  <div class="parent">

    <!-- KPI TOTAL -->
    <div class="card kpi">
      <span>Total de Vendas</span>
      <h2 id="kpiTotal"></h2>
    </div>

    <!-- KPI QTD PEDIDOS -->
    <div class="card kpi">
      <span>Quantidade de Pedidos</span>
      <h2 id="kpiPedidos"></h2>
    </div>

    <!-- KPI MELHOR VENDEDOR -->
    <div class="card kpi">
      <span>Melhor Vendedor</span>
      <h2 id="kpiTopVendedor"></h2>
    </div>

    <!-- CARD VAZIO (pode usar depois) -->
    <div class="card"></div>

    <!-- GRÁFICO VENDEDOR -->
    <div class="card chart-card div5">
      <h4>Total de Vendas por Vendedor</h4>
      <div class="chart-container">
        <canvas id="grafico"></canvas>
      </div>
    </div>

    <!-- GRÁFICO MÊS -->
    <div class="card chart-card div6">
      <h4>Vendas por Mês</h4>
      <div class="chart-container">
        <canvas id="graficoMes"></canvas>
      </div>
    </div>

  </div>

</div>

<script>

// ========================
let dados = []
let chart
let chartMes

// ========================
fetch('data.json')
  .then(res => res.json())
  .then(json => {

    document.getElementById('ultimaAtualizacao')
      .innerText = "Última atualização: " + json.atualizado_em

    dados = json.dados

    atualizarKPIs(dados)
    preencherFiltro(dados)
    atualizarGraficos('all')
  })

// ========================
function atualizarKPIs(dadosFiltrados) {

  // TOTAL
  const total = dadosFiltrados.reduce((acc, d) => acc + d.total, 0)
  document.getElementById('kpiTotal')
    .innerText = "R$ " + total.toLocaleString('pt-BR')

  // QTD PEDIDOS
  document.getElementById('kpiPedidos')
    .innerText = dadosFiltrados.length

  // MELHOR VENDEDOR
  let resumo = {}

  dadosFiltrados.forEach(d => {
    if (!resumo[d.vendedor]) resumo[d.vendedor] = 0
    resumo[d.vendedor] += d.total
  })

  let top = Object.entries(resumo)
    .sort((a,b) => b[1] - a[1])[0]

  document.getElementById('kpiTopVendedor')
    .innerText = top ? top[0] : "-"
}

// ========================
function preencherFiltro(dados) {
  const regioes = [...new Set(dados.map(d => d.regiao))]
  const select = document.getElementById('filtroRegiao')

  regioes.forEach(r => {
    let option = document.createElement('option')
    option.value = r
    option.text = r
    select.appendChild(option)
  })
}

// ========================
document.getElementById('filtroRegiao')
  .addEventListener('change', (e) => {
    let filtrado = e.target.value === 'all'
      ? dados
      : dados.filter(d => d.regiao === e.target.value)

    atualizarKPIs(filtrado)
    atualizarGraficoVendedor(filtrado)
    atualizarGraficoMes(filtrado)
  })

// ========================
function atualizarGraficos() {
  atualizarGraficoVendedor(dados)
  atualizarGraficoMes(dados)
}

// ========================
function atualizarGraficoVendedor(dadosFiltrados) {

  let resumo = {}

  dadosFiltrados.forEach(d => {
    if (!resumo[d.vendedor]) resumo[d.vendedor] = 0
    resumo[d.vendedor] += d.total
  })

  if (chart) chart.destroy()

  chart = new Chart(document.getElementById('grafico'), {
    type: 'bar',
    data: {
      labels: Object.keys(resumo),
      datasets: [{
        label: 'Total de Vendas',
        data: Object.values(resumo)
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  })
}

// ========================
function atualizarGraficoMes(dadosFiltrados) {

  let resumo = {}

  dadosFiltrados.forEach(d => {
    if (!resumo[d.mes]) resumo[d.mes] = 0
    resumo[d.mes] += d.total
  })

  let labels = Object.keys(resumo).sort((a,b) => a-b)

  if (chartMes) chartMes.destroy()

  chartMes = new Chart(document.getElementById('graficoMes'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Vendas por Mês',
        data: labels.map(l => resumo[l])
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  })
}

</script>

</body>
</html>
